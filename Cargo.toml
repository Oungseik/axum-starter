[package]
name = "axum-starter"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9" }
axum-tracing-opentelemetry = "0.33.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenv = "0.15.0"
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["tokio"] }
opentelemetry-otlp = { version = "0.31.1", features = [
  "grpc-tonic",
  "tokio",
  "tonic",
] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = [
  "chrono",
  "runtime-tokio-rustls",
  "sqlite",
  "uuid",
] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.23", features = ["tracing"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
